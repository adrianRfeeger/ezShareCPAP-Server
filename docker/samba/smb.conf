[global]
server role = standalone server
map to guest = Never
server min protocol = SMB2
smb ports = 445
load printers = no
printing = bsd
printcap name = /dev/null
disable spoolss = yes
log file = /dev/stdout
max log size = 0

[CPAP]
path = /share
browseable = yes
read only = yes
guest ok = no
valid users = cpap
follow symlinks = yes
wide links = no
veto files = /.staging-*/.current-*/
